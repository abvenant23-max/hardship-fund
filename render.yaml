# Render Blueprint: the database, the API and the web app from this repo.
# Render dashboard → New → Blueprint → pick the repository. Step-by-step
# guide, including the settings to fill in: docs/DEPLOY.md.

databases:
  - name: hardship-db
    plan: free                  # free databases expire after a while; see docs/DEPLOY.md
    postgresMajorVersion: "16"
    databaseName: hardship_platform
    user: hardship_app

services:
  - type: web
    name: hardship-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HARDSHIP_DSN
        fromDatabase:
          name: hardship-db
          property: connectionString
      - key: HARDSHIP_SECRET
        generateValue: true     # signs sign-in tokens
      - key: HARDSHIP_ADMIN_USER
        value: admin
      - key: HARDSHIP_ADMIN_PASSWORD
        sync: false             # asked for on first deploy
      - key: HARDSHIP_MODEL_REPO
        sync: false             # e.g. your-name/hardship-models on the Hugging Face Hub
      - key: HF_TOKEN
        sync: false             # Hugging Face token with read access to that repository
      - key: HARDSHIP_CORS_ORIGINS
        sync: false             # the web app's address, e.g. https://hardship-web.onrender.com

  - type: web
    name: hardship-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite           # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE
        sync: false             # the API's address, e.g. https://hardship-api.onrender.com
