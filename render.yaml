# Render Blueprint: one web service (the app at /, the API at /api) and a
# Postgres database. Render dashboard → New → Blueprint → pick this
# repository. Step-by-step guide: docs/DEPLOY.md.

databases:
  - name: hardship-db
    plan: free                  # free databases expire after about a month; see docs/DEPLOY.md
    postgresMajorVersion: "16"
    databaseName: hardship_platform
    user: hardship_app

services:
  - type: web
    name: hardship-fund
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/web.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: HARDSHIP_DSN
        fromDatabase:
          name: hardship-db
          property: connectionString
      - key: HARDSHIP_SECRET
        generateValue: true     # signs sign-in tokens
      - key: HARDSHIP_ADMIN_USER
        value: admin
      - key: HARDSHIP_ADMIN_PASSWORD
        sync: false             # asked for when the blueprint is applied
      - key: HARDSHIP_MODEL_REPO
        sync: false             # e.g. your-name/hardship-models on the Hugging Face Hub
      - key: HF_TOKEN
        sync: false             # Hugging Face token that can read that repository
